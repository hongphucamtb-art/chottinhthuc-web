<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Quản trị Cầu An – Cầu Siêu · Tịnh Thất A Di Đà</title>
<link rel="icon" href="../../logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif:wght@600;700;800&display=swap">
<style>
:root{--do:#7B1E1E;--do2:#5A1616;--do3:#3E0F0F;--vang:#C8961E;--vang2:#F3C74A;--vang3:#F8DC80;--kem:#FBF6EC;--giay:#F3E6CB;--trang:#fff;--nau:#3B2E20;--mo:#7A6650;--vien:#EADCC1;--kem-chu:#FFF3D6;--xanh:#2f7a4a;
  --f:'Be Vietnam Pro',system-ui,sans-serif;--fs:'Noto Serif',Georgia,serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--kem);color:var(--nau);font-family:var(--f);font-size:15px}
button,input,select{font:inherit}
[hidden]{display:none!important}
.dau{background:linear-gradient(180deg,var(--do2),var(--do3));color:var(--kem-chu);padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.dau .w{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dau b{font-family:var(--fs);font-size:20px}.dau small{display:block;color:var(--vang3);letter-spacing:2px;font-size:11.5px;font-weight:700}
.dau .sp{flex:1}
.dau a,.dau button{color:var(--vang3);background:none;border:1px solid rgba(243,199,74,.4);border-radius:999px;padding:7px 14px;text-decoration:none;cursor:pointer;font-size:13.5px;font-weight:600}
.w{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* đăng nhập */
.dn{max-width:380px;margin:56px auto;background:var(--trang);border:1px solid var(--vien);border-radius:20px;padding:28px 24px;box-shadow:0 14px 34px rgba(62,15,15,.1);text-align:center}
.dn h1{font-family:var(--fs);color:var(--do);font-size:24px;margin:6px 0 4px}
.dn p{color:var(--mo);margin:0 0 18px;font-size:14px}
.dn input{width:100%;padding:12px 14px;border:1px solid var(--vien);border-radius:12px;font-size:16px;margin-bottom:12px;text-align:center}
.nut{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--do);color:var(--kem-chu)}
.nut.vang{background:var(--vang2);color:var(--do3)}.nut.nhat{background:var(--trang);color:var(--do);border:1px solid var(--vien)}.nut.xoa{background:#fff;color:#b3261e;border:1px solid #e5b8b2}
.nut:disabled{opacity:.45;cursor:not-allowed}
.dn .nut{width:100%}
.loi{color:#b3261e;font-size:14px;min-height:20px;margin-top:10px}
/* bảng điều khiển */
.tke{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0 16px}
.tke div{background:var(--trang);border:1px solid var(--vien);border-radius:14px;padding:12px 14px}
.tke b{display:block;font-size:24px;color:var(--do);font-variant-numeric:tabular-nums}.tke span{color:var(--mo);font-size:13px}
.loc{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--trang);border:1px solid var(--vien);border-radius:14px;padding:12px;position:sticky;top:0;z-index:5}
.loc select,.loc input[type=search]{padding:9px 12px;border:1px solid var(--vien);border-radius:10px;background:#fff;min-width:0}
.loc input[type=search]{flex:1 1 200px}
.thao{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.thao .dem{color:var(--mo);font-size:14px;margin-right:auto}
.ds{display:grid;gap:10px;margin-bottom:60px}
.don{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--trang);border:1px solid var(--vien);border-left:5px solid #b8241a;border-radius:14px;padding:12px 14px}
.don.sieu{border-left-color:#c8941a}
.don.da{opacity:.62}
.don input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--do)}
.don h3{margin:0 0 4px;font-size:16px;color:var(--nau)}
.don .ten{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.don .ten span{background:var(--kem);border:1px solid var(--vien);border-radius:8px;padding:3px 9px;font-weight:600;font-size:14px}
.don .phu{color:var(--mo);font-size:13px;line-height:1.55}
.chip{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.5px;padding:3px 9px;border-radius:999px;margin-right:6px;vertical-align:1px}
.chip.an{background:#fbe3df;color:#9a1e14}.chip.sieu{background:#fbefcc;color:#7a5208}.chip.da{background:#dcefe2;color:#1f6a3a}
.don time{color:var(--mo);font-size:12.5px;white-space:nowrap}
.trong{text-align:center;color:var(--mo);padding:40px 16px;background:var(--trang);border:1px dashed var(--vien);border-radius:14px}
/* hộp xác nhận */
.hop{position:fixed;inset:0;background:rgba(30,10,10,.5);display:grid;place-items:center;z-index:30;padding:16px}
.hop>div{background:#fff;border-radius:18px;max-width:400px;width:100%;padding:22px;text-align:center}
.hop h3{font-family:var(--fs);color:var(--do);margin:0 0 8px}.hop p{color:var(--mo);margin:0 0 18px}
.hop .hang{display:flex;gap:10px;justify-content:center}
/* xem trước khi in */
.xem{position:fixed;inset:0;background:#5d5248;z-index:20;overflow:auto}
.xem-thanh{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--do3);color:var(--kem-chu);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.xem-thanh b{font-family:var(--fs);font-size:17px;margin-right:auto}
.xem-thanh select{padding:8px 10px;border-radius:10px;border:0}
.xem-thanh label{font-size:13.5px;display:flex;align-items:center;gap:6px}
#inVung{padding:20px 0 60px}
/* ===== BÀI VỊ (theo phần mềm BaiVi v1.5.3: mẫu nền gốc + chữ Times) ===== */
@font-face{font-family:'BV Serif';src:local('Times New Roman'),local('TimesNewRomanPSMT'),url(fonts/LiberationSerif-Regular.ttf) format('truetype');font-weight:400}
@font-face{font-family:'BV Serif';src:local('Times New Roman Bold'),local('TimesNewRomanPS-BoldMT'),url(fonts/LiberationSerif-Bold.ttf) format('truetype');font-weight:700}
.trangA4{width:210mm;height:297mm;margin:0 auto 18px;background:#fff;padding:6mm;display:flex;align-items:center;justify-content:center;gap:4mm;box-shadow:0 8px 24px rgba(0,0,0,.35);overflow:hidden}
.bv{position:relative;flex:none;background-size:100% 100%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bv.an{background-image:url(tpl_cau_an.jpg);aspect-ratio:2230/6530}
.bv.sieu{background-image:url(tpl_cau_sieu.jpg);aspect-ratio:2008/6044}
.bv .khung{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bv .chu{font-family:'BV Serif','Times New Roman',Times,serif;color:#000;white-space:nowrap}
.bv .chu.giua{text-align:center}
.bv .chu .d{display:block;line-height:var(--lh,1.3)}
.bv .chu .t{display:block;height:calc(var(--lh,1.3)*.55em)}
.bv.chon{outline:.6mm dashed #b8912f;outline-offset:1mm}
@media (max-width:760px){.tke{grid-template-columns:repeat(2,minmax(0,1fr))}.don{grid-template-columns:auto minmax(0,1fr)}.don time{grid-column:2}}
@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff}
  body>*:not(.xem){display:none!important}
  .xem{position:static;background:#fff;overflow:visible}
  .xem-thanh{display:none!important}
  #inVung{padding:0}
  .trangA4{margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .trangA4:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>
<body>
<header class="dau"><div class="w"><div><small>TỊNH THẤT A DI ĐÀ</small><b>Quản trị Cầu An – Cầu Siêu</b></div><span class="sp"></span><a href="../../#tinhthat">Về trang chùa</a><button type="button" id="thoat" hidden>Đăng xuất</button></div></header>

<main class="w">
 <section id="dangNhap" class="dn">
  <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#7B1E1E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
  <h1>Đăng nhập quản trị</h1>
  <p>Nhập mật khẩu để xem danh sách Phật tử gửi về và in bài vị.</p>
  <form id="fDn"><label for="mk" style="position:absolute;left:-9999px">Mật khẩu</label><input id="mk" type="password" autocomplete="current-password" placeholder="Mật khẩu" required><button class="nut" type="submit" id="bDn">Vào trang quản trị</button></form>
  <div class="loi" id="loiDn" role="alert"></div>
 </section>

 <section id="bang" hidden>
  <div class="tke"><div><b id="tTong">0</b><span>Lượt gửi về</span></div><div><b id="tAn">0</b><span>Người cầu an</span></div><div><b id="tSieu">0</b><span>Hương linh cầu siêu</span></div><div><b id="tChua">0</b><span>Chưa in</span></div></div>
  <div class="loc">
   <select id="lLoai" aria-label="Lọc loại"><option value="">Cầu an và cầu siêu</option><option value="an">Chỉ cầu an</option><option value="sieu">Chỉ cầu siêu</option></select>
   <select id="lKy" aria-label="Lọc kỳ lễ"><option value="">Mọi kỳ lễ</option></select>
   <select id="lIn" aria-label="Lọc trạng thái"><option value="chua">Chưa in</option><option value="da">Đã in</option><option value="">Tất cả</option></select>
   <input type="search" id="lTim" placeholder="Tìm tên, người đứng cầu, số điện thoại…" aria-label="Tìm">
   <button type="button" class="nut nhat" id="bTai">Tải lại</button>
  </div>
  <div class="thao">
   <label style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" id="chonHet" style="width:18px;height:18px;accent-color:#7B1E1E"> Chọn tất cả</label>
   <span class="dem" id="dem"></span>
   <button type="button" class="nut vang" id="bIn" disabled>In bài vị</button>
   <button type="button" class="nut nhat" id="bDaIn" disabled>Đánh dấu đã in</button>
   <button type="button" class="nut nhat" id="bCsv" disabled>Tải Excel</button>
   <button type="button" class="nut xoa" id="bXoa" disabled>Xóa</button>
  </div>
  <div class="ds" id="ds"></div>
 </section>
</main>

<div class="xem" id="xem" hidden>
 <div class="xem-thanh"><b>Xem trước bài vị</b>
  <label for="khoGiay">Số bài vị / tờ A4</label><select id="khoGiay"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select>
  <label><input type="checkbox" id="oSo" checked> Đánh số</label><label><input type="checkbox" id="oDam"> Chữ đậm</label><label><input type="checkbox" id="oGiua"> Canh giữa</label>
  <label for="oCo">Cỡ chữ</label><input type="range" id="oCo" min="60" max="140" value="100" style="width:90px">
  <button type="button" class="nut vang" id="bInNgay">In ngay</button>
  <button type="button" class="nut nhat" id="bDong">Đóng</button>
 </div>
 <div id="inVung"></div>
</div>

<div class="hop" id="hop" hidden><div><h3 id="hopTieu"></h3><p id="hopChu"></p><div class="hang"><button type="button" class="nut nhat" id="hopKhong">Hủy</button><button type="button" class="nut" id="hopCo">Đồng ý</button></div></div></div>

<script src="../ca-api.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const API=window.CA_API||'';
let PASS='';try{PASS=sessionStorage.getItem('caPass')||'';}catch(e){}
let DS=[],chon=new Set();
const LOI={'mat-khau':'Mật khẩu không đúng, hoặc đăng nhập sai quá nhiều lần (đợi 15 phút rồi thử lại).','mang':'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.','chua-cai':'Chưa kết nối Google Sheet. Cần dán link Ứng dụng web vào tệp tinhthat/ca-api.js.'};
async function goi(o){if(!API)throw new Error('chua-cai');let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});}catch(e){throw new Error('mang');}
  let j;try{j=await r.json();}catch(e){throw new Error('mang');}if(!j.ok)throw new Error(j.loi||'loi');return j;}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bo=s=>String(s||'').replace(/^'/,'');

async function tai(){const j=await goi({act:'ds',pass:PASS});DS=(j.ds||[]).sort((a,b)=>(b.thoiGian||0)-(a.thoiGian||0));
  const ky=[...new Set(DS.map(d=>bo(d.kyLe)).filter(Boolean))];const sel=$('lKy'),cu=sel.value;sel.innerHTML='<option value="">Mọi kỳ lễ</option>'+ky.map(k=>`<option>${esc(k)}</option>`).join('');sel.value=ky.includes(cu)?cu:'';
  chon=new Set([...chon].filter(id=>DS.some(d=>d.id===id)));ve();}
function loc(){const l=$('lLoai').value,k=$('lKy').value,i=$('lIn').value,t=$('lTim').value.trim().toLowerCase();
  return DS.filter(d=>(!l||d.loai===l)&&(!k||bo(d.kyLe)===k)&&(!i||(i==='da'?d.daIn:!d.daIn))&&(!t||[d.dungCau,d.sdt,d.diaChi,...d.nguoi.map(n=>n.ten+' '+n.pd)].join(' ').toLowerCase().includes(t)));}
function ve(){const v=loc();
  $('tTong').textContent=DS.length;$('tAn').textContent=DS.filter(d=>d.loai==='an').reduce((s,d)=>s+d.nguoi.length,0);$('tSieu').textContent=DS.filter(d=>d.loai==='sieu').reduce((s,d)=>s+d.nguoi.length,0);$('tChua').textContent=DS.filter(d=>!d.daIn).length;
  const box=$('ds');
  if(!v.length){box.innerHTML=`<div class="trong">${DS.length?'Không có danh sách nào khớp bộ lọc.':'Chưa có danh sách nào. Khi Phật tử gửi trên trang chùa, danh sách sẽ hiện ở đây.'}</div>`;}
  else box.innerHTML=v.map(d=>{const t=d.thoiGian?new Date(d.thoiGian):null;
    return `<article class="don ${d.loai}${d.daIn?' da':''}"><input type="checkbox" data-id="${esc(d.id)}" ${chon.has(d.id)?'checked':''} aria-label="Chọn danh sách của ${esc(bo(d.dungCau))}">
    <div><h3><span class="chip ${d.loai}">${d.loai==='an'?'CẦU AN':'CẦU SIÊU'}</span>${d.daIn?'<span class="chip da">ĐÃ IN</span>':''}${esc(bo(d.kyLe)||'Không ghi kỳ lễ')}</h3>
    <div class="ten">${d.nguoi.map(n=>`<span>${esc(bo(n.ten))}${n.pd?' · PD '+esc(bo(n.pd)):''}</span>`).join('')}</div>
    <div class="phu">Người đứng cầu: <b>${esc(bo(d.dungCau))}</b>${d.sdt?' · '+esc(bo(d.sdt)):''}${d.diaChi?' · '+esc(bo(d.diaChi)):''}${d.ghiChu?'<br>Ghi chú: '+esc(bo(d.ghiChu)):''}</div></div>
    <time>${t?t.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):''}</time></article>`;}).join('');
  const hienChon=v.filter(d=>chon.has(d.id)).length;$('chonHet').checked=v.length>0&&hienChon===v.length;
  $('dem').textContent=`Đang hiện ${v.length} danh sách · đã chọn ${chon.size}`;['bIn','bDaIn','bXoa','bCsv'].forEach(b=>$(b).disabled=!chon.size);}
$('ds').addEventListener('change',e=>{const c=e.target.closest('input[data-id]');if(!c)return;c.checked?chon.add(c.dataset.id):chon.delete(c.dataset.id);ve();});
$('chonHet').addEventListener('change',e=>{loc().forEach(d=>e.target.checked?chon.add(d.id):chon.delete(d.id));ve();});
['lLoai','lKy','lIn'].forEach(i=>$(i).addEventListener('change',ve));$('lTim').addEventListener('input',ve);
$('bTai').onclick=()=>chay($('bTai'),tai);

function hoi(tieu,chu,nut){return new Promise(ok=>{$('hopTieu').textContent=tieu;$('hopChu').textContent=chu;$('hopCo').textContent=nut;$('hop').hidden=false;
  const xong=v=>{$('hop').hidden=true;$('hopCo').onclick=$('hopKhong').onclick=null;ok(v);};$('hopCo').onclick=()=>xong(true);$('hopKhong').onclick=()=>xong(false);});}
async function chay(btn,fn){const t=btn.textContent;btn.disabled=true;btn.textContent='Đang xử lý…';try{await fn();}catch(e){alertLoi(e);}finally{btn.textContent=t;btn.disabled=false;if(btn.id!=='bTai'&&btn.id!=='bDn')ve();}}
function alertLoi(e){const m=LOI[e.message]||'Có lỗi xảy ra, vui lòng thử lại.';if(e.message==='mat-khau'){thoat();$('loiDn').textContent=m;}else{$('hopKhong').hidden=true;hoi('Chưa thực hiện được',m,'Đã hiểu').then(()=>{$('hopKhong').hidden=false;});}}
$('bDaIn').onclick=()=>chay($('bDaIn'),async()=>{await goi({act:'daIn',pass:PASS,ids:[...chon]});DS.forEach(d=>{if(chon.has(d.id))d.daIn=true;});chon.clear();});
$('bXoa').onclick=async()=>{const n=chon.size;if(!await hoi('Xóa '+n+' danh sách?','Các danh sách đã chọn sẽ bị xóa hẳn khỏi danh sách và không khôi phục được. Nên in hoặc tải Excel trước khi xóa.','Xóa hẳn'))return;
  chay($('bXoa'),async()=>{await goi({act:'xoa',pass:PASS,ids:[...chon]});DS=DS.filter(d=>!chon.has(d.id));chon.clear();});};
$('bCsv').onclick=()=>{const hang=[['Loại','Kỳ lễ','Họ tên','Pháp danh','Năm sinh','Năm mất','Hưởng dương/thọ','Người đứng cầu','Điện thoại','Địa chỉ','Ghi chú','Ngày gửi']];
  DS.filter(d=>chon.has(d.id)).forEach(d=>d.nguoi.forEach(n=>hang.push([d.loai==='an'?'Cầu an':'Cầu siêu',bo(d.kyLe),bo(n.ten),bo(n.pd),bo(n.sinh),bo(n.mat),bo(n.tuoi),bo(d.dungCau),bo(d.sdt),bo(d.diaChi),bo(d.ghiChu),d.thoiGian?new Date(d.thoiGian).toLocaleString('vi-VN'):''])));
  const csv='﻿'+hang.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='cau-an-cau-sieu.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);};

/* ===== BÀI VỊ – dàn chữ giống phần mềm BaiVi v1.5.3 ===== */
const TPL={an:{w:2230,h:6530,r:[0.1229,0.3234,0.8767,0.7738]},sieu:{w:2008,h:6044,r:[0.1165,0.2647,0.8765,0.8132]}};
const NAM=new Date().getFullYear();
const hoaChu=t=>bo(t).toLowerCase().replace(/\s+/g,' ').trim().replace(/(^|\s)(\S)/g,(m,a,c)=>a+c.toUpperCase());
function tuoiTu(n,loai){const so=x=>{const m=String(x||'').match(/\d{1,3}/);return m?+m[0]:0;};
  const t=bo(n.tuoi).toLowerCase();if(t){const k=so(t);if(k){if(/d[uư][oơ]ng/.test(t))return 'HĐ : '+k+'T';if(/th[oọ]/.test(t))return 'HT : '+k+'T';return k+'t';}}
  const sinh=(String(n.sinh||'').match(/(18|19|20)\d\d/)||[])[0];if(!sinh)return '';
  if(loai==='sieu'){const mat=(String(n.mat||'').match(/(18|19|20)\d\d/)||[])[0];if(mat)return (mat-sinh+1)+'t';return '';}
  return (NAM-sinh+1)+'t';}
function dongTen(n,loai){return [hoaChu(n.ten),n.pd?'PD '+hoaChu(n.pd):'',tuoiTu(n,loai)].filter(Boolean).join(' - ');}
const MOI=20;// tối đa số tên trên một bài vị, nhiều hơn thì sang bài vị mới
function veIn(){const per=+$('khoGiay').value,so=$('oSo').checked,dam=$('oDam').checked,giua=$('oGiua').checked,co=+$('oCo').value/100;
  const the=[];
  DS.filter(d=>chon.has(d.id)).sort((a,b)=>a.loai===b.loai?0:a.loai==='an'?-1:1).forEach(d=>{const ds=d.nguoi.map(n=>dongTen(n,d.loai));for(let i=0;i<ds.length;i+=MOI)the.push({loai:d.loai,ds:ds.slice(i,i+MOI)});});
  // khổ ô: A4 trừ lề 6mm, khe 4mm
  const AW=198,AH=285,GAP=4,slotW=(AW-GAP*(per-1))/per;
  let h='';
  for(let i=0;i<the.length;i+=per){h+='<div class="trangA4">';
    the.slice(i,i+per).forEach(t=>{const T=TPL[t.loai];const k=Math.min(slotW/T.w,AH/T.h);const w=T.w*k,hh=T.h*k;const [x0,y0,x1,y1]=T.r;
      const pw=(x1-x0)*.03,ph=(y1-y0)*.015;
      const dong=t.ds.map((l,j)=>`<span class="d">${so?(String(j+1).padStart(String(t.ds.length).length,' '))+'. ':''}${esc(l)}</span>`).join('');
      h+=`<div class="bv ${t.loai}" style="width:${w.toFixed(2)}mm;height:${hh.toFixed(2)}mm"><div class="khung" style="left:${((x0+pw)*100).toFixed(3)}%;top:${((y0+ph)*100).toFixed(3)}%;right:${((1-x1+pw)*100).toFixed(3)}%;bottom:${((1-y1+ph)*100).toFixed(3)}%"><div class="chu${giua?' giua':''}" style="font-weight:${dam?700:400}">${dong}</div></div></div>`;});
    h+='</div>';}
  $('inVung').innerHTML=h||'<p style="color:#fff;text-align:center">Chưa chọn danh sách nào.</p>';
  // canh cỡ chữ lớn nhất vừa khung (như phần mềm), tối đa 8.5% chiều cao khung
  const fit=()=>document.querySelectorAll('#inVung .khung').forEach(k=>{const c=k.firstElementChild,W=k.clientWidth,H=k.clientHeight;let lo=4,hi=Math.max(20,H),best=lo;
    while(lo<=hi){const m=(lo+hi)>>1;c.style.fontSize=m+'px';if(c.scrollWidth<=W&&c.scrollHeight<=H){best=m;lo=m+1;}else hi=m-1;}
    let sz=Math.min(best,Math.floor(H*.085));sz=Math.max(4,sz*co);c.style.fontSize=sz+'px';let g=0;while((c.scrollWidth>W||c.scrollHeight>H)&&sz>4&&g<200){sz-=.5;g++;c.style.fontSize=sz+'px';}});
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(fit));}
['oSo','oDam','oGiua','oCo'].forEach(i=>$(i).addEventListener('input',veIn));
$('bIn').onclick=()=>{veIn();$('xem').hidden=false;document.body.style.overflow='hidden';};
$('khoGiay').onchange=veIn;
$('bDong').onclick=()=>{$('xem').hidden=true;document.body.style.overflow='';};
$('bInNgay').onclick=async()=>{window.print();if(await hoi('Đánh dấu đã in?','Đánh dấu các danh sách vừa in là "đã in" để lần sau không in trùng.','Đánh dấu')){$('xem').hidden=true;document.body.style.overflow='';$('bDaIn').click();}};

/* ===== ĐĂNG NHẬP ===== */
function vao(){$('dangNhap').hidden=true;$('bang').hidden=false;$('thoat').hidden=false;}
function thoat(){PASS='';try{sessionStorage.removeItem('caPass');}catch(e){}DS=[];chon.clear();$('dangNhap').hidden=false;$('bang').hidden=true;$('thoat').hidden=true;$('mk').value='';}
$('thoat').onclick=thoat;
$('fDn').addEventListener('submit',e=>{e.preventDefault();$('loiDn').textContent='';PASS=$('mk').value;
  chay($('bDn'),async()=>{try{await tai();try{sessionStorage.setItem('caPass',PASS);}catch(x){}vao();}catch(err){PASS='';$('loiDn').textContent=LOI[err.message]||'Không đăng nhập được, vui lòng thử lại.';}});});
if(!API)$('loiDn').textContent=LOI['chua-cai'];
if(PASS)tai().then(vao).catch(()=>thoat());
})();
</script>
